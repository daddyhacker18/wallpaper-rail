name: An idea
description: Something you would like Wallpaper Rail to do, or to do differently.
title: "Idea: "
labels: ["idea"]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the open issues and this is not already suggested.
          required: true
  - type: textarea
    id: want
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it would let you do
      description: The situation you are in when you want this. It often matters more than the suggestion itself.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What you do at the moment instead
    validations:
      required: false
